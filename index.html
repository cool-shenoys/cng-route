<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e4f">
<title>CNG Route</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#f3f5f2;--card:#ffffff;--ink:#17201b;--muted:#5e6a62;--line:#e1e6e0;--field:#f1f3f0;
  --accent:#0b6e4f;--accent-ink:#fff;--route:#1a73e8;--shadow:0 2px 10px rgba(20,30,25,.16),0 1px 3px rgba(20,30,25,.12);
  --active:#1a9850;--likely:#3b6fd4;--stale:#c98a0c;--closed:#c2410c;--warn-bg:#fff4e0;--warn-ink:#7a4d00;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#101512;--card:#1a211d;--ink:#e7ece8;--muted:#9aa69e;--line:#2c3630;--field:#232b26;
  --accent:#3fbf8c;--accent-ink:#06120c;--route:#6ea8ff;--shadow:0 2px 12px rgba(0,0,0,.5);
  --active:#3fcf7a;--likely:#6f9bf0;--stale:#e3a93a;--closed:#f0764a;--warn-bg:#3a2c10;--warn-ink:#f3cf8a}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#101512;--card:#1a211d;--ink:#e7ece8;--muted:#9aa69e;--line:#2c3630;--field:#232b26;
  --accent:#3fbf8c;--accent-ink:#06120c;--route:#6ea8ff;--shadow:0 2px 12px rgba(0,0,0,.5);
  --active:#3fcf7a;--likely:#6f9bf0;--stale:#e3a93a;--closed:#f0764a;--warn-bg:#3a2c10;--warn-ink:#f3cf8a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--route);outline-offset:2px}
a{color:var(--route)}

/* search card */
.top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 8px 6px}
.wp{display:grid;grid-template-columns:22px 1fr 34px;align-items:center;gap:6px;position:relative}
.wp + .wp{margin-top:4px}
.wp .mk{width:12px;height:12px;border-radius:50%;justify-self:center;border:2px solid var(--muted)}
.wp.start .mk{border-color:var(--route);background:var(--card)}
.wp.stop .mk{border-radius:3px;border-color:var(--muted);background:var(--muted);width:10px;height:10px}
.wp.dest .mk{border:0;background:var(--closed);border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:13px;height:13px}
.wp input{width:100%;border:0;background:var(--field);color:var(--ink);border-radius:9px;padding:9px 10px;font:15px var(--body);min-width:0}
.iconbtn{width:34px;height:34px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--field)}
.iconbtn svg{width:20px;height:20px}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-left:28px}
.link{border:0;background:none;color:var(--route);font-weight:600;font-size:14px;padding:6px 4px}
.sugg{position:absolute;left:28px;right:40px;top:100%;margin-top:4px;background:var(--card);border-radius:10px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button.sel{background:var(--field)}
.sugg small{display:block;color:var(--muted);font-size:12.5px}

/* bottom sheet */
.sheet{position:fixed;z-index:1000;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:56vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .25s ease}
.sheet.hidden{transform:translateY(calc(100% + 20px))}
.sheethead{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0 16px;flex:none}
.sheethead .ttl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.showpanel{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);border:0;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);padding:10px 18px;font-weight:600;display:flex;align-items:center;gap:8px}
.showpanel svg,.sheethead svg{width:18px;height:18px}
.body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
h2{font:700 24px/1.05 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--route);border-color:var(--route);color:#fff}
.btn:disabled{opacity:.5}
.btn svg{width:17px;height:17px}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.field label{font-weight:500}
.field output,.num{font:600 18px var(--display);font-variant-numeric:tabular-nums}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.num{width:84px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:6px 8px;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;background:var(--field)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.next{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.next .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:12.5px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:20px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:9px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .m{width:14px;height:14px;border-radius:50%;margin:3px 0 0 3px;background:var(--muted);position:relative;z-index:1;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.tl .t{font-weight:600}
.tl .s{color:var(--muted);font-size:13px}
.tl .acts{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap}
.tl .acts a,.tl .acts button{font-size:13.5px;font-weight:600;border:0;background:none;padding:0;color:var(--route);text-decoration:none}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:3px}
details .bk{margin:6px 0 0;padding-left:10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.fab{position:fixed;z-index:999;right:12px;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--route)}
.fab svg{width:22px;height:22px}
/* report dialog */
.scrim{position:fixed;inset:0;z-index:2000;background:rgba(10,15,12,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:2px}
.opt small{font-weight:400;color:var(--muted);font-size:12px}
.opt.good{border-color:var(--active);background:color-mix(in srgb,var(--active) 12%,var(--card))}
.opt.bad{border-color:color-mix(in srgb,var(--closed) 50%,var(--line))}
.toast{position:fixed;z-index:3000;left:50%;transform:translateX(-50%);bottom:calc(58vh + 10px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.spin{animation-duration:3s}}
.leaflet-container{font:13px var(--body);background:var(--paper)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px}
.pop h3{font:700 19px/1.1 var(--display);margin:0 0 4px}
.pop .acts{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.pop .acts a,.pop .acts button{border:0;background:none;padding:0;font-weight:600;color:var(--route);text-decoration:none;font-size:13.5px}
.pin{display:grid;place-items:center;border-radius:50%;color:#fff;font:700 11px var(--display);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-control-attribution{font-size:10px}
.dark-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.nf{display:flex;flex-direction:column;gap:4px}.nf span{display:flex;align-items:center;gap:6px;color:var(--muted)}

@media (min-width:900px){
  .top{right:auto;width:400px;left:12px}
  .sheet{left:12px;right:auto;width:400px;top:auto;bottom:12px;border-radius:14px;max-height:calc(100vh - 220px)}
  .toast{bottom:24px;left:calc(50% + 200px)}
  .scrim{align-items:center}.dlg{border-radius:18px}
}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="top" id="top">
  <div id="wps"></div>
  <div class="toprow">
    <button class="link" id="addStop" type="button">+ Add stop</button>
    <button class="link" id="swap" type="button" aria-label="Swap start and destination">⇅ Swap</button>
  </div>
</div>

<button class="fab" id="theme" type="button" aria-label="Change colour theme" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
<button class="fab" id="locate" type="button" aria-label="Show my location">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<section class="sheet" id="sheet">
  <div class="sheethead"><span class="ttl" id="sheetTitle">Plan</span>
    <span><button class="iconbtn" id="hidePanel" type="button" aria-label="Hide panel" title="Hide panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button></span></div>
  <div class="body" id="body"></div>
</section>
<button class="showpanel" id="showPanel" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg><span id="showLabel">Show panel</span></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
